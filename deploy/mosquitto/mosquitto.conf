# Secured Mosquitto for the PdM project. Paths below are the docker-compose
# container paths; for a bare-metal install, adjust them (see deploy/README.md).
per_listener_settings true

# LAN listener: username/password required, but traffic is NOT encrypted.
# Use only on a trusted network; prefer 8883 where the device supports TLS.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS listener (recommended; the bridge/simulator use it with --tls --cafile).
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
